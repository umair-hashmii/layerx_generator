name: layerx_generator
description: A Flutter package that auto-generates a structured LayerX directory with GetX integration, MVVM pattern, and essential services for scalable projects.
version: 2.0.1
homepage: https://github.com/Umaiir11/layerx_generator
repository: https://github.com/Umaiir11/layerx_generator
issue_tracker: https://github.com/Umaiir11/layerx_generator/issues

environment:
  sdk: '>=2.18.0 <3.0.0'

dependencies:
  args: ^2.4.2
  path: ^1.8.3


dev_dependencies:
  test: ^1.24.0
  lints: ^5.1.1

executables:
  layerx_generator: layerx_generator

